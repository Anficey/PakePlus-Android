<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alice & Bob 共同出行时间规划</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#090d18;--surface:#111827;--card:#1a2332;--border:#253045;--fg:#e8edf5;--muted:#7a8ba8;--accent:#e8a838;--green:#10b981;--orange:#f97316;--red:#ef4444;--cyan:#06b6d4;--purple:#8b5cf6;--slate:#334155}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:'Noto Sans SC',sans-serif;min-height:100vh;overflow-x:hidden}
.mono{font-family:'JetBrains Mono',monospace}
.bg-glow{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0}
.glow-1{width:500px;height:500px;background:rgba(232,168,56,.06);top:-100px;left:-100px;animation:d1 20s ease-in-out infinite}
.glow-2{width:400px;height:400px;background:rgba(16,185,129,.05);bottom:-80px;right:-80px;animation:d2 25s ease-in-out infinite}
.glow-3{width:300px;height:300px;background:rgba(6,182,212,.04);top:40%;left:60%;animation:d3 18s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(80px,60px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,-80px)}}
@keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,50px)}}
.cal-cell{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 4px;min-height:88px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.cal-cell:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 20px rgba(232,168,56,.1)}
.cal-cell.empty{background:transparent;border-color:transparent;cursor:default;min-height:0}
.cal-cell.empty:hover{transform:none;box-shadow:none}
.cal-cell.selected{border-color:var(--accent)!important;box-shadow:0 0 0 2px rgba(232,168,56,.3)}
.cal-cell.overlap-good{background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(16,185,129,.04))}
.cal-cell.overlap-good::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--green);border-radius:8px 8px 0 0}
.cal-cell.overlap-partial{background:linear-gradient(135deg,rgba(249,115,22,.08),rgba(249,115,22,.03))}
.cal-cell.overlap-partial::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--orange);border-radius:8px 8px 0 0}
.badge{display:inline-block;padding:1px 5px;border-radius:4px;font-size:10px;font-weight:600;line-height:1.4}
.badge-aw{background:rgba(239,68,68,.2);color:#fca5a5}
.badge-an{background:rgba(139,92,246,.2);color:#c4b5fd}
.badge-af{background:rgba(16,185,129,.2);color:#6ee7b7}
.badge-bw{background:rgba(139,92,246,.2);color:#c4b5fd}
.badge-br{background:rgba(6,182,212,.2);color:#67e8f9}
.badge-bh{background:rgba(232,168,56,.2);color:#fbbf24}
.badge-bt{background:rgba(239,68,68,.15);color:#fca5a5}
.ov-tag{font-size:11px;font-weight:700;color:var(--green)}
.ov-tag.partial{color:var(--orange)}
.timeline{position:relative;height:28px;background:var(--surface);border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.timeline .seg{position:absolute;top:0;height:100%;transition:all .3s}
.tl-af{background:rgba(16,185,129,.5)}
.tl-aw{background:rgba(239,68,68,.5)}
.tl-bf{background:rgba(6,182,212,.5)}
.tl-bw{background:rgba(139,92,246,.5)}
.tl-bu{background:rgba(100,116,139,.35)}
.tl-ov{background:rgba(232,168,56,.65);border:1px solid rgba(232,168,56,.9)}
.hour-mark{position:absolute;top:0;height:100%;border-left:1px solid rgba(255,255,255,.08);z-index:2;pointer-events:none}
.hour-label{position:absolute;top:-18px;font-size:9px;color:var(--muted);transform:translateX(-50%);font-family:'JetBrains Mono',monospace}
.detail-panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-top:16px;animation:su .3s ease}
@keyframes su{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.nav-btn{background:var(--card);border:1px solid var(--border);color:var(--fg);width:40px;height:40px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.nav-btn:hover{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 18px;text-align:center}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.toast{position:fixed;top:20px;right:20px;background:var(--card);border:1px solid var(--green);color:var(--green);padding:12px 20px;border-radius:10px;font-size:14px;z-index:999;animation:ti .3s ease}
@keyframes ti{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:640px){.cal-cell{min-height:72px;padding:4px 2px}.badge{font-size:8px;padding:0 3px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="bg-glow glow-1"></div>
<div class="bg-glow glow-2"></div>
<div class="bg-glow glow-3"></div>

<div class="relative z-10 max-w-5xl mx-auto px-3 sm:px-6 py-6">

<header class="text-center mb-8">
  <h1 class="text-3xl sm:text-4xl font-black tracking-tight" style="color:var(--accent)">
    <i class="fa-solid fa-person-walking-arrow-right mr-2 text-2xl" style="color:var(--green)"></i>共同出行时间规划
  </h1>
  <p class="mt-2 text-sm" style="color:var(--muted)">Alice（4天循环）& Bob（7天循环 + 法定假日）· 共同自由外出时间 &gt; 3小时即可同行</p>
</header>

<div id="stats-bar" class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6"></div>

<div class="flex items-center justify-between mb-4">
  <div class="flex items-center gap-2">
    <button class="nav-btn" onclick="prevMonth()" aria-label="上个月"><i class="fa-solid fa-chevron-left text-sm"></i></button>
    <button class="nav-btn" onclick="nextMonth()" aria-label="下个月"><i class="fa-solid fa-chevron-right text-sm"></i></button>
  </div>
  <h2 id="month-title" class="text-lg sm:text-xl font-bold mono"></h2>
  <div class="flex items-center gap-2">
    <button class="nav-btn text-xs" onclick="goToday()" aria-label="今天" style="width:auto;padding:0 12px;font-size:12px;font-family:'Noto Sans SC'">今天</button>
    <button class="nav-btn text-xs" onclick="findNext()" aria-label="下一可出行日" style="width:auto;padding:0 12px;font-size:12px;font-family:'Noto Sans SC';background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.3);color:var(--green)">
      <i class="fa-solid fa-magnifying-glass mr-1"></i>下一可出行
    </button>
  </div>
</div>

<div class="grid grid-cols-7 gap-1 mb-1">
  <div class="text-center text-xs font-medium py-1" style="color:var(--muted)">一</div>
  <div class="text-center text-xs font-medium py-1" style="color:var(--muted)">二</div>
  <div class="text-center text-xs font-medium py-1" style="color:var(--muted)">三</div>
  <div class="text-center text-xs font-medium py-1" style="color:var(--muted)">四</div>
  <div class="text-center text-xs font-medium py-1" style="color:var(--muted)">五</div>
  <div class="text-center text-xs font-medium py-1" style="color:var(--orange)">六</div>
  <div class="text-center text-xs font-medium py-1" style="color:var(--red)">日</div>
</div>

<div id="calendar-grid" class="grid grid-cols-7 gap-1"></div>

<div class="mt-5 p-4 rounded-xl" style="background:var(--surface);border:1px solid var(--border)">
  <div class="text-xs font-semibold mb-3" style="color:var(--muted)"><i class="fa-solid fa-palette mr-1"></i>图例说明</div>
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
    <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>可共同出行(&gt;3h)</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--orange)"></div>有重叠但不足3h</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--slate)"></div>无重叠</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div>法定假日</div>
  </div>
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-3">
    <div class="legend-item"><span class="badge badge-aw">A白班</span></div>
    <div class="legend-item"><span class="badge badge-an">A夜班</span></div>
    <div class="legend-item"><span class="badge badge-af">A休</span></div>
    <div class="legend-item"><span class="badge badge-bh">B假</span></div>
  </div>
  <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-3">
    <div class="legend-item"><span class="badge badge-bw">B班</span></div>
    <div class="legend-item"><span class="badge badge-br">B休</span></div>
    <div class="legend-item"><span class="badge badge-bt">B调</span></div>
  </div>
  <p class="text-xs mt-3" style="color:var(--muted);opacity:.6">* 2026年法定假日日期为预估，以国务院公告为准</p>
</div>

<div id="detail-panel" class="hidden"></div>

</div>

<script>
/* ========== 节假日数据 ========== */
const HOLIDAYS = new Set([
  '2025-01-01',
  '2025-01-28','2025-01-29','2025-01-30','2025-01-31','2025-02-01','2025-02-02','2025-02-03','2025-02-04',
  '2025-04-04','2025-04-05','2025-04-06',
  '2025-05-01','2025-05-02','2025-05-03','2025-05-04','2025-05-05',
  '2025-05-31','2025-06-01','2025-06-02',
  '2025-10-01','2025-10-02','2025-10-03','2025-10-04','2025-10-05','2025-10-06','2025-10-07','2025-10-08',
  '2026-01-01','2026-01-02','2026-01-03',
  '2026-02-15','2026-02-16','2026-02-17','2026-02-18','2026-02-19','2026-02-20','2026-02-21',
  '2026-04-04','2026-04-05','2026-04-06',
  '2026-05-01','2026-05-02','2026-05-03','2026-05-04','2026-05-05',
  '2026-06-19','2026-06-20','2026-06-21',
  '2026-10-01','2026-10-02','2026-10-03','2026-10-04','2026-10-05','2026-10-06','2026-10-07',
]);
const TIAOXIU = new Set([
  '2025-01-26','2025-02-08','2025-04-27','2025-09-28','2025-10-11',
  '2026-02-14','2026-04-26','2026-05-09','2026-09-27','2026-10-10',
]);

/* ========== 核心逻辑 ========== */
const ALICE_START = new Date(2026, 4, 2); // 2026-05-02 = DAY-1

function getAliceDay(date) {
  const s = new Date(ALICE_START); s.setHours(0,0,0,0);
  const d = new Date(date); d.setHours(0,0,0,0);
  const diff = Math.round((d - s) / 86400000);
  return ((diff % 4) + 4) % 4 + 1; // 1~4
}

function getAliceFree(cd) {
  return cd===1?[[0,9],[21,24]]:cd===2?[[0,21]]:cd===3?[[9,24]]:[[0,24]];
}
function getAliceWork(cd) {
  return cd===1?[[9,21]]:cd===2?[[21,24]]:cd===3?[[0,9]]:[];
}
function getAliceSegs(cd) {
  return cd===1?[{s:0,e:9,t:'free'},{s:9,e:21,t:'work'},{s:21,e:24,t:'free'}]:
         cd===2?[{s:0,e:21,t:'free'},{s:21,e:24,t:'work'}]:
         cd===3?[{s:0,e:9,t:'work'},{s:9,e:24,t:'free'}]:
                [{s:0,e:24,t:'free'}];
}

function fmtDate(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function getBobSchedule(date) {
  const ds = fmtDate(date);
  const dow = date.getDay();

  if (HOLIDAYS.has(ds)) {
    return { type:'holiday', freeTime:[[0,24]], segments:[{s:0,e:24,t:'free'}] };
  }
  if (TIAOXIU.has(ds)) {
    // 调休：按工作日，使用两段班模式
    return { type:'tiaoxiu', freeTime:[], segments:[
      {s:0,e:8,t:'unit'},{s:8,e:12,t:'work'},{s:12,e:14.5,t:'unit'},
      {s:14.5,e:18,t:'work'},{s:18,e:24,t:'unit'}
    ]};
  }
  if (dow===0||dow===6) {
    return { type:'rest', freeTime:[[8,21.5]], segments:[
      {s:0,e:8,t:'unit'},{s:8,e:21.5,t:'free'},{s:21.5,e:24,t:'unit'}
    ]};
  }
  // 周一(1)、周四(4)：三段班
  if (dow===1||dow===4) {
    return { type:'work', freeTime:[], segments:[
      {s:0,e:8,t:'unit'},{s:8,e:12,t:'work'},{s:12,e:14.5,t:'unit'},
      {s:14.5,e:18,t:'work'},{s:18,e:20,t:'unit'},{s:20,e:22,t:'work'},{s:22,e:24,t:'unit'}
    ]};
  }
  // 周二(2)、周三(3)、周五(5)：两段班
  return { type:'work', freeTime:[], segments:[
    {s:0,e:8,t:'unit'},{s:8,e:12,t:'work'},{s:12,e:14.5,t:'unit'},
    {s:14.5,e:18,t:'work'},{s:18,e:24,t:'unit'}
  ]};
}

function calcOverlap(a, b) {
  let total = 0; const overlaps = [];
  for (const [s1,e1] of a) for (const [s2,e2] of b) {
    const os=Math.max(s1,s2), oe=Math.min(e1,e2);
    if (oe>os) { total+=oe-os; overlaps.push([os,oe]); }
  }
  return {total, overlaps};
}

function fmtH(h) {
  const hh=Math.floor(h), mm=Math.round((h-hh)*60);
  return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}

/* ========== 状态 ========== */
let curYear = 2026, curMonth = 4, selDate = null;

/* ========== 渲染 ========== */
function renderAll() {
  renderCalendar();
  renderStats();
  if (selDate) renderDetail(selDate);
}

function renderCalendar() {
  const grid = document.getElementById('calendar-grid');
  grid.innerHTML = '';
  const first = new Date(curYear, curMonth, 1);
  const days = new Date(curYear, curMonth+1, 0).getDate();
  let startDow = (first.getDay()+6)%7; // 周一=0

  for (let i=0; i<startDow; i++) {
    const c = document.createElement('div');
    c.className='cal-cell empty'; grid.appendChild(c);
  }

  for (let day=1; day<=days; day++) {
    const date = new Date(curYear, curMonth, day);
    const aDay = getAliceDay(date);
    const bSched = getBobSchedule(date);
    const {total:ovH} = calcOverlap(getAliceFree(aDay), bSched.freeTime);

    const cell = document.createElement('div');
    cell.className = 'cal-cell';
    if (ovH>3) cell.classList.add('overlap-good');
    else if (ovH>0) cell.classList.add('overlap-partial');
    if (selDate && fmtDate(date)===fmtDate(selDate)) cell.classList.add('selected');

    // 日期
    const dn = document.createElement('div');
    dn.className='text-sm font-bold mb-1';
    dn.style.color = date.getDay()===0?'var(--red)':date.getDay()===6?'var(--orange)':'var(--fg)';
    dn.textContent=day; cell.appendChild(dn);

    // Alice徽章
    const ab = document.createElement('div'); ab.className='mb-0.5';
    const aCfg={1:{c:'badge-aw',t:'A白班'},2:{c:'badge-an',t:'A夜班'},3:{c:'badge-af',t:'A休'},4:{c:'badge-af',t:'A休'}};
    ab.innerHTML=`<span class="badge ${aCfg[aDay].c}">${aCfg[aDay].t}</span>`;
    cell.appendChild(ab);

    // Bob徽章
    const bb = document.createElement('div'); bb.className='mb-1';
    const bCfg={work:{c:'badge-bw',t:'B班'},rest:{c:'badge-br',t:'B休'},holiday:{c:'badge-bh',t:'B假'},tiaoxiu:{c:'badge-bt',t:'B调'}};
    const bc = bCfg[bSched.type];
    bb.innerHTML=`<span class="badge ${bc.c}">${bc.t}</span>`;
    cell.appendChild(bb);

    // 重叠
    if (ovH>0) {
      const od = document.createElement('div');
      od.className='ov-tag'+(ovH<=3?' partial':'');
      od.textContent=ovH.toFixed(1)+'h';
      cell.appendChild(od);
    }

    cell.onclick=()=>selectDate(date);
    cell.setAttribute('role','button');
    cell.setAttribute('aria-label',`${curYear}年${curMonth+1}月${day}日`);
    grid.appendChild(cell);
  }

  document.getElementById('month-title').textContent=`${curYear}年${curMonth+1}月`;
}

function renderStats() {
  const bar = document.getElementById('stats-bar');
  const days = new Date(curYear, curMonth+1, 0).getDate();
  let good=0, totalH=0;
  for (let d=1; d<=days; d++) {
    const date=new Date(curYear, curMonth, d);
    const aDay=getAliceDay(date), bS=getBobSchedule(date);
    const {total}=calcOverlap(getAliceFree(aDay), bS.freeTime);
    if (total>3){good++;totalH+=total;}
  }
  bar.innerHTML=`
    <div class="stat-card"><div class="text-2xl font-black mono" style="color:var(--green)">${good}</div><div class="text-xs mt-1" style="color:var(--muted)">可出行天数</div></div>
    <div class="stat-card"><div class="text-2xl font-black mono" style="color:var(--accent)">${totalH.toFixed(0)}</div><div class="text-xs mt-1" style="color:var(--muted)">总出行小时</div></div>
    <div class="stat-card"><div class="text-2xl font-black mono" style="color:var(--cyan)">${(good/days*100).toFixed(0)}%</div><div class="text-xs mt-1" style="color:var(--muted)">日占比</div></div>
    <div class="stat-card"><div class="text-2xl font-black mono" style="color:var(--slate)">${days-good}</div><div class="text-xs mt-1" style="color:var(--muted)">不可出行天</div></div>`;
}

function selectDate(date) {
  selDate=date; renderCalendar(); renderDetail(date);
}

function renderDetail(date) {
  const panel=document.getElementById('detail-panel');
  panel.classList.remove('hidden');

  const aDay=getAliceDay(date), bS=getBobSchedule(date);
  const aFree=getAliceFree(aDay), aSegs=getAliceSegs(aDay);
  const {total:ovH, overlaps}=calcOverlap(aFree, bS.freeTime);
  const canGo=ovH>3;
  const ds=fmtDate(date);
  const dayN=['日','一','二','三','四','五','六'];
  const aNames={1:'DAY-1 白班 (09:00-21:00)',2:'DAY-2 夜班 (21:00-次日09:00)',3:'DAY-3 休 (夜班续至09:00)',4:'DAY-4 全休'};
  const bNames={work:'工作日',rest:'休息日 (08:00-21:30)',holiday:'法定假日',tiaoxiu:'调休上班'};

  function buildTL(segs, prefix) {
    const cls={alice:{free:'tl-af',work:'tl-aw'},bob:{free:'tl-bf',work:'tl-bw',unit:'tl-bu'}};
    let h='<div class="relative mt-6 mb-2">';
    for(let t=0;t<=24;t+=3){const p=(t/24*100).toFixed(2);h+=`<div class="hour-mark" style="left:${p}%"></div><div class="hour-label" style="left:${p}%">${String(t).padStart(2,'0')}</div>`;}
    h+=`<div class="timeline" style="margin-top:22px">`;
    for(const sg of segs){const l=(sg.s/24*100).toFixed(2),w=((sg.e-sg.s)/24*100).toFixed(2);h+=`<div class="seg ${cls[prefix][sg.t]||'tl-bu'}" style="left:${l}%;width:${w}%"></div>`;}
    h+='</div></div>'; return h;
  }

  function buildOverlapTL() {
    let h='<div class="relative mt-4 mb-2">';
    for(let t=0;t<=24;t+=3){const p=(t/24*100).toFixed(2);h+=`<div class="hour-mark" style="left:${p}%"></div><div class="hour-label" style="left:${p}%">${String(t).padStart(2,'0')}</div>`;}
    h+=`<div class="timeline" style="margin-top:22px">`;
    for(const sg of aSegs){if(sg.t!=='free')continue;const l=(sg.s/24*100).toFixed(2),w=((sg.e-sg.s)/24*100).toFixed(2);h+=`<div class="seg" style="left:${l}%;width:${w}%;background:rgba(16,185,129,.15)"></div>`;}
    for(const[os,oe] of overlaps){const l=(os/24*100).toFixed(2),w=((oe-os)/24*100).toFixed(2);h+=`<div class="seg tl-ov" style="left:${l}%;width:${w}%"></div>`;}
    h+='</div></div>'; return h;
  }

  function fmtFree(ivs){return ivs.length?ivs.map(([s,e])=>fmtH(s)+'-'+fmtH(e)).join('，'):'无自由外出时间';}

  const sc=canGo?'var(--green)':ovH>0?'var(--orange)':'var(--slate)';
  const st=canGo?'可以共同出行':ovH>0?'重叠不足3小时，无法共同出行':'无共同自由时间';

  panel.innerHTML=`<div class="detail-panel">
    <div class="flex items-center justify-between mb-4">
      <div><span class="text-lg font-bold">${date.getFullYear()}年${date.getMonth()+1}月${date.getDate()}日 周${dayN[date.getDay()]}</span>
      ${HOLIDAYS.has(ds)?'<span class="badge badge-bh ml-2">法定假日</span>':''}${TIAOXIU.has(ds)?'<span class="badge badge-bt ml-2">调休上班</span>':''}</div>
      <button onclick="closeDetail()" class="text-sm px-3 py-1 rounded-lg" style="color:var(--muted);background:var(--surface);border:1px solid var(--border)" aria-label="关闭"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="p-4 rounded-xl mb-5" style="background:${canGo?'rgba(16,185,129,.1)':'rgba(100,116,139,.08)'};border:1px solid ${canGo?'rgba(16,185,129,.25)':'rgba(100,116,139,.15)'}">
      <div class="flex items-center gap-3">
        <i class="fa-solid ${canGo?'fa-circle-check':'fa-circle-xmark'} text-2xl" style="color:${sc}"></i>
        <div><div class="font-bold text-lg" style="color:${sc}">${st}</div>
        <div class="text-sm mt-0.5" style="color:var(--muted)">共同自由外出时间：<span class="mono font-semibold" style="color:${sc}">${ovH.toFixed(1)}小时</span></div></div>
      </div>
      ${overlaps.length?`<div class="mt-2 text-sm" style="color:var(--muted)">可同行时段：<span class="mono font-semibold" style="color:var(--accent)">${overlaps.map(([s,e])=>fmtH(s)+' - '+fmtH(e)).join('，')}</span></div>`:''}
    </div>
    <div class="mb-5"><div class="flex items-center gap-2 mb-1"><div class="w-2.5 h-2.5 rounded" style="background:var(--green)"></div><span class="text-sm font-semibold">Alice · ${aNames[aDay]}</span></div>
    <div class="text-xs mb-1" style="color:var(--muted)">自由外出：${fmtFree(aFree)}</div>${buildTL(aSegs,'alice')}
    <div class="flex justify-between text-xs" style="color:var(--muted)"><span><span class="inline-block w-2 h-2 rounded" style="background:rgba(16,185,129,.5)"></span> 自由</span><span><span class="inline-block w-2 h-2 rounded" style="background:rgba(239,68,68,.5)"></span> 工作</span></div></div>
    <div class="mb-5"><div class="flex items-center gap-2 mb-1"><div class="w-2.5 h-2.5 rounded" style="background:var(--cyan)"></div><span class="text-sm font-semibold">Bob · ${bNames[bS.type]}</span></div>
    <div class="text-xs mb-1" style="color:var(--muted)">自由外出：${fmtFree(bS.freeTime)}</div>${buildTL(bS.segments,'bob')}
    <div class="flex justify-between text-xs flex-wrap gap-1" style="color:var(--muted)"><span><span class="inline-block w-2 h-2 rounded" style="background:rgba(6,182,212,.5)"></span> 自由</span><span><span class="inline-block w-2 h-2 rounded" style="background:rgba(139,92,246,.5)"></span> 工作</span><span><span class="inline-block w-2 h-2 rounded" style="background:rgba(100,116,139,.35)"></span> 单位休息</span></div></div>
    <div><div class="flex items-center gap-2 mb-1"><div class="w-2.5 h-2.5 rounded" style="background:var(--accent)"></div><span class="text-sm font-semibold">重叠分析</span></div>${buildOverlapTL()}
    <div class="flex justify-between text-xs" style="color:var(--muted)"><span><span class="inline-block w-2 h-2 rounded" style="background:rgba(232,168,56,.65);border:1px solid rgba(232,168,56,.9)"></span> 共同自由</span><span><span class="inline-block w-2 h-2 rounded" style="background:rgba(16,185,129,.15)"></span> 仅Alice自由</span></div></div>
  </div>`;
}

function closeDetail() {
  document.getElementById('detail-panel').classList.add('hidden');
  selDate=null; renderCalendar();
}

/* ========== 导航 ========== */
function prevMonth(){curMonth--;if(curMonth<0){curMonth=11;curYear--;}selDate=null;document.getElementById('detail-panel').classList.add('hidden');renderAll();}
function nextMonth(){curMonth++;if(curMonth>11){curMonth=0;curYear++;}selDate=null;document.getElementById('detail-panel').classList.add('hidden');renderAll();}
function goToday(){const n=new Date();curYear=n.getFullYear();curMonth=n.getMonth();selDate=null;document.getElementById('detail-panel').classList.add('hidden');renderAll();showToast('已跳转到当月');}

function findNext() {
  let d=new Date(curYear, curMonth, 1);
  for(let i=0;i<365;i++){
    const aD=getAliceDay(d), bS=getBobSchedule(d);
    const {total}=calcOverlap(getAliceFree(aD), bS.freeTime);
    if(total>3){
      curYear=d.getFullYear(); curMonth=d.getMonth();
      selDate=new Date(d); renderAll();
      showToast(`找到可出行日：${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} (${total.toFixed(1)}小时)`);
      return;
    }
    d.setDate(d.getDate()+1);
  }
  showToast('未找到可出行日');
}

function showToast(msg) {
  const old=document.querySelector('.toast');if(old)old.remove();
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=`<i class="fa-solid fa-circle-info mr-2"></i>${msg}`;
  document.body.appendChild(t); setTimeout(()=>t.remove(),3000);
}

/* ========== 初始化 ========== */
curYear=2026; curMonth=4;
renderAll();
</script>
</body>
</html>
